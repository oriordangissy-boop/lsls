<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标签工作台 · 时计 TIMEPIECE</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"></head><body class="label-page"><header class="label-header"><a href="./">← 返回腕表系列</a><span class="overline">TIMEPIECE / LABEL STUDIO</span></header><main class="label-shell"><div class="studio-grid"><section class="studio-form"><span class="overline">PRINT & SHARE</span><h1>腕表标签工作台</h1><p>选择腕表，生成带有价格与型号的二维码标签。二维码在本机生成，无需外部图片服务。</p><label for="record-picker">选择款式<select id="record-picker"></select></label><label for="label-mode">标签类型<select id="label-mode"><option value="product">款式价格标签</option><option value="sample">单表编号样张（未绑定实物）</option></select></label><label for="public-url">网站地址<input id="public-url" type="url" placeholder="https://你的域名/"></label><p class="hint">部署后填写正式 HTTPS 地址；支持 GitHub Pages 子目录。</p><button id="generate-button" class="button dark" type="button">更新二维码 ↗</button><div class="control-row"><button id="print-button" class="button outline" type="button" disabled>打印标签</button> <button id="download-button" class="text-link" type="button" disabled>下载二维码 SVG</button></div><p id="studio-status" class="studio-status" role="status"></p></section><section class="studio-preview"><span class="overline">70 × 40 MM / PRINT PREVIEW</span><div id="label-output"></div><p class="label-note">打印设置：原始大小 100% · 关闭页眉页脚</p></section></div></main><script src="data/registry.js"></script><script src="vendor/qrcode.js"></script><script src="label.js"></script></body></html>
