<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立编号标签 · 时计 TIMEPIECE</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="edition.css?v=4"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"></head><body class="label-page">
<header class="label-header"><a href="./">← 返回腕表系列</a><span class="overline">TIMEPIECE / LABEL STUDIO</span></header>
<main class="label-shell"><div class="studio-grid"><section class="studio-form"><span class="overline">INDIVIDUALLY NUMBERED</span><h1>独立编号标签</h1><p>从已签发的 1,000 个编号中选择对应腕表。每枚编号拥有固定的独立二维码，补印不会改变原链接。</p>
<label for="record-picker">选择款式<select id="record-picker"></select></label>
<label for="label-mode">标签类型<select id="label-mode"><option value="unit">单表独立编号标签</option><option value="product">款式价格标签（同款共用）</option></select></label>
<label for="unit-picker" id="unit-field">选择此枚编号<select id="unit-picker"></select></label>
<label for="public-url">网站地址<input id="public-url" type="url" placeholder="https://你的域名/"></label><p class="hint">使用已部署的正式 HTTPS 地址。贴牌前按清单核对款式和编号。</p>
<button id="generate-button" class="button dark" type="button">更新二维码 ↗</button><div class="control-row"><button id="print-button" class="button outline" type="button" disabled>打印标签</button> <button id="download-button" class="text-link" type="button" disabled>下载二维码 SVG</button></div><p id="studio-status" class="studio-status" role="status"></p></section>
<section class="studio-preview"><span class="overline">70 × 40 MM / PRINT PREVIEW</span><div id="label-output"></div><p class="label-note">打印设置：原始大小 100% · 关闭页眉页脚</p></section></div></main>
<script src="data/registry.js?v=5"></script><script src="data/units.js?v=4"></script><script src="vendor/qrcode.js"></script><script src="label.js?v=5"></script></body></html>
